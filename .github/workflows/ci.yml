name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Check repository boundaries
        run: npm run verify:repository
      - name: Test verification guards
        run: npm run test:verification
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Run backend tests
        run: npm run test:backend
      - name: Run deterministic three-run gate
        run: npm run verify:three-runs
      - name: Build production frontend
        run: npm run build
