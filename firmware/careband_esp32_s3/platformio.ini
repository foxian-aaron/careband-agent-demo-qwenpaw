[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src
include_dir = include
test_dir = test

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@^7.4.2

[env:native]
platform = native
platform_packages =
  platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_toolchain.py
test_framework = unity
test_build_src = yes
build_src_filter =
  +<button_state_machine.cpp>
  +<event_identity.cpp>
  +<retry_queue.cpp>
  -<main.cpp>
build_flags =
  -std=gnu++17
  -static
  -static-libgcc
  -static-libstdc++
